name: CI

# Cancel prev CI if new commit come
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v*.*
  pull_request:
    branches:
      - main
      - v*.*
    paths:
      - 'client/**'
      - 'go/**'
      - 'packages/**'
      - 'scripts/profile-browser-runtime.ts'
      - 'scripts/run-workspace-agent-capacity.ts'
      - 'scripts/workspace-agent-product-smoke.ts'
      - 'server/**'
      - 'configs/ts/tsconfig.runtime-scripts.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/workspace-agent-capacity.yml'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [24.x]
        ci-project: [node, jsdom]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install libsecret-1
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:versions

      - name: CI
        shell: bash
        run: |
          set -o pipefail
          pnpm run ci --selectProjects ${{ matrix.ci-project }} 2>&1 | tee jest-output.log

      - name: Summarize test failure
        if: failure()
        shell: bash
        run: |
          if [ -f jest-output.log ]; then
            echo '### jest tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 jest-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CORE_CODECOV_TOKEN }}
          flags: ${{ matrix.ci-project }}
          directory: ./coverage

  workspace-agent:
    name: Workspace Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: workspace-agent
            gateway-binary: ws-gateway
            artifact-suffix: macos
          - os: ubuntu-latest
            binary: workspace-agent
            gateway-binary: ws-gateway
            artifact-suffix: linux
          - os: windows-latest
            binary: workspace-agent.exe
            gateway-binary: ws-gateway.exe
            artifact-suffix: windows

    steps:
      - uses: actions/checkout@v7
      - name: Use Go from workspace-agent/go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go/workspace-agent/go.mod
          cache-dependency-path: go/workspace-agent/go.sum

      - name: Use Node.js 24 for the dependency-free packager
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test native watcher, cancellation and race safety
        working-directory: go/workspace-agent
        shell: bash
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee go-test.log

      - name: Summarize go test failure
        if: failure()
        working-directory: go/workspace-agent
        shell: bash
        run: |
          if [ -f go-test.log ]; then
            echo '### go test tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(--- FAIL|=== RUN|    .*_test\.go|FAIL|ok  |panic)" go-test.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || tail -n 120 go-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vet
        working-directory: go/workspace-agent
        run: go vet ./...

      - name: Build native release binary
        working-directory: go/workspace-agent
        run: |
          go build -buildvcs=false -trimpath -o bin/${{ matrix.binary }} ./cmd/workspace-agent
          go build -buildvcs=false -trimpath -o bin/${{ matrix.gateway-binary }} ./cmd/ws-gateway

      - name: Package native binary, manifest and startup proof
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON server/scripts/package-workspace-agent.ts --revision ci-${{ github.sha }}

      - name: Cross-build Linux arm64
        if: ${{ runner.os == 'Linux' }}
        working-directory: go/workspace-agent
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -buildvcs=false -trimpath -o bin/workspace-agent-linux-arm64 ./cmd/workspace-agent
          go build -buildvcs=false -trimpath -o bin/ws-gateway-linux-arm64 ./cmd/ws-gateway

      - name: Upload verified native package
        uses: actions/upload-artifact@v4
        with:
          name: workspace-agent-${{ matrix.artifact-suffix }}
          if-no-files-found: error
          retention-days: 7
          path: server/dist/workspace-agent/

  workspace-agent-product-smoke:
    name: Workspace Agent product smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
            output-platform: linux
          - os: windows-2025
            artifact-suffix: windows
            output-platform: win32

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Use Go from workspace-agent/go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go/workspace-agent/go.mod
          cache-dependency-path: go/workspace-agent/go.sum

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      - name: Summarize install failure
        if: failure()
        shell: bash
        run: |
          if [ -f install.log ]; then
            echo '### install tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 install.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build production client, server and native Workspace Agent
        run: |
          pnpm run init
          pnpm run build:client
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON server/scripts/package-workspace-agent.ts --revision ci-${{ github.sha }}

      - name: Install Chromium and Linux browser dependencies
        if: ${{ runner.os == 'Linux' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium
        if: ${{ runner.os == 'Windows' }}
        run: pnpm exec playwright install chromium

      - name: Exercise Search, Watch, transport and process cleanup
        shell: bash
        run: |
          set -o pipefail
          pnpm run smoke:workspace-agent:product 2>&1 | tee smoke-output.log

      - name: Summarize product smoke failure
        if: failure()
        shell: bash
        run: |
          if [ -f smoke-output.log ]; then
            echo '### product smoke tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 smoke-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/workspace-agent/product-smoke-darwin.json ]; then echo 'warning: darwin evidence on CI' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload Workspace Agent product-smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-agent-product-smoke-${{ matrix.artifact-suffix }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/workspace-agent/product-smoke-${{ matrix.output-platform }}.json
            output/playwright/workspace-agent-product-smoke-${{ matrix.output-platform }}.png
