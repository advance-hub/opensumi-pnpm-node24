name: E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main, v*.*]
  pull_request:
    branches: [main, v*.*]

# Cancel prev CI if new commit come
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ubuntu-latest, Node.js 24.x

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install libsecret-1
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Use Node.js "24.x"
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile

      - name: Init
        run: pnpm run init

      - name: Run & Test
        run: |
          pnpm run download-extension
          pnpm run rebuild:node
          SUPPORT_LOAD_WORKSPACE_BY_HASH=true OPENSUMI_E2E_COMMANDS=true pnpm run start:e2e &
          bash tools/playwright/scripts/wait.sh && pnpm --dir tools/playwright run ui-tests-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/playwright/test-results
