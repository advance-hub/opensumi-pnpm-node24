name: CHECK

# Cancel prev CI if new commit come
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, v*.*]
  pull_request:
    branches: [main, v*.*]

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Reject high and critical production vulnerabilities
        run: pnpm run audit:production

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm run init 2>&1 | tee build-init.log
          pnpm run build:client 2>&1 | tee build-client.log
          pnpm run build:server 2>&1 | tee build-server.log
          pnpm run bundle:lite 2>&1 | tee bundle-lite.log
          pnpm run bundle:preview 2>&1 | tee bundle-preview.log

      - name: Summarize build failure
        if: failure()
        run: |
          for file in build-init.log build-client.log build-server.log bundle-lite.log bundle-preview.log; do
            if [ -f "$file" ]; then
              echo "### $file (tail)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Lint
        run: |
          pnpm run lint --quiet
          pnpm run check:dep
          pnpm run check:versions

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          pnpm run init 2>&1 | tee build-init.log
          pnpm run build:client 2>&1 | tee build-client.log
          pnpm run build:server 2>&1 | tee build-server.log
          pnpm run bundle:lite 2>&1 | tee bundle-lite.log
          pnpm run bundle:preview 2>&1 | tee bundle-preview.log

      - name: Summarize build failure
        if: failure()
        shell: bash
        run: |
          for file in install.log build-init.log build-client.log build-server.log bundle-lite.log bundle-preview.log; do
            if [ -f "$file" ]; then
              echo "### $file (tail)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Lint
        run: |
          pnpm run lint --quiet
          pnpm run check:dep
          pnpm run check:versions
